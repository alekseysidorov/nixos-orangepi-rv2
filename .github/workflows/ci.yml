name: "Test"
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Cross-package checks are intentionally not part of CI: building the
      # RISC-V bootstrap closure is too expensive for GitHub-hosted runners.
      - run: nix fmt -- --check
